<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' wss://mqtt.flespi.io; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Volets">
  <meta name="theme-color" content="#1D2733">
  <title>Volets io</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="masthead">
      <h1>Volets</h1>
      <p id="connection" class="status status-off" role="status">Pas de connexion</p>
    </div>
    <button id="open-settings" class="icon-button" type="button" aria-label="Réglages">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/></svg>
    </button>
  </header>

  <main>
    <section id="devices-view" hidden>
      <ul id="devices"></ul>
      <p id="empty" class="empty" hidden>Aucun volet pour l'instant. Ils apparaîtront ici dès que le boîtier sera en ligne.</p>
      <p id="drag-hint" class="hint" hidden>Faites glisser un volet pour choisir sa hauteur.</p>
    </section>

    <section id="settings-view" hidden>
      <h2>Connexion au boîtier</h2>
      <p class="lead">Le jeton flespi et la clé de commande se trouvent dans <code>include/secrets.h</code>.</p>
      <p id="settings-error" class="error" role="alert" hidden></p>
      <form id="settings-form" novalidate>
        <label>Jeton flespi
          <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>Clé de commande
          <input id="command-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </label>
        <button class="primary" type="submit">Enregistrer</button>
        <button id="close-settings" type="button" hidden>Fermer</button>
        <button id="logout" class="danger" type="button" hidden>Se déconnecter</button>
      </form>
    </section>
  </main>

  <dialog id="device-dialog" aria-labelledby="device-dialog-title">
    <form id="device-form" novalidate>
      <h2 id="device-dialog-title">Réglages du volet</h2>
      <label>Nom
        <input id="device-name" maxlength="32" required>
      </label>
      <label>Pièce
        <input id="device-room" list="room-list" maxlength="32" autocomplete="off" placeholder="Aucune">
      </label>
      <datalist id="room-list"></datalist>
      <label>Temps de course (secondes)
        <input id="device-time" type="number" inputmode="numeric" min="1" max="600" step="1" required>
      </label>
      <label class="checkbox">
        <input id="device-repeat" type="checkbox">
        Réessayer si le volet ne répond pas
      </label>
      <p id="device-error" class="error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button id="device-cancel" type="button">Annuler</button>
        <button class="primary" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
